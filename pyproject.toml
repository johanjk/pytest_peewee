[project]
name = "pytest-peewee"
dynamic = ["version"]
description = 'Pytest testing extensions for Peewee.'
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = [
  "test",
  "unittest",
  "peewee",
  "pytest",
]
authors = [
  { name = "johanjk", email = "johan@datarokade.com" },
]
maintainers = [
  { name = "johanjk", email = "johan@datarokade.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",

  "Framework :: Pytest",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "peewee>=4.2.4",
  "pytest>=9.0.0",
  "sqlfluff>=3.5.0",
  "pydantic>=2.5.2",
  "rich>=14.2.0",
  "pygments>=2.21.0",
]
[dependency-groups]
test = [
  "coverage[toml]>=6.5",
  "mktestdocs",
  "pytest-xdist>=3.8.0",
]
dev = [
  "psycopg",
  "psycopg-binary",
  "pymysql",
  "poethepoet>=0.45",
  "ruff",
  "deptry",
]
types = [
  "mypy>=1.0.0",
  "pyright[nodejs]",
  "ty>=0.0.95",
  "types-pygments>=2.21.0.20260819",
]
dist = [
  "check-wheel-contents",
  "pkginfo",
  "pydistcheck",
  "pyroma",
  "twine",
  "uv",
  "wheel-inspect",
]

[project.urls]
Documentation = "https://github.com/johanjk/pytest_peewee#readme"
Issues = "https://github.com/johanjk/pytest_peewee/issues"
Source = "https://github.com/johanjk/pytest_peewee"

[project.entry-points.pytest11]
peewee = "pytest_peewee"

[tool.uv]
package = true
default-groups = "all"

[build-system]
requires = [
  "hatchling",
  "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pytest_peewee/version.py"

[tool.hatch.build]
exclude = [
  "/.github",
  ".gitignore",
]
only-packages = true
skip-excluded-dirs = true
[tool.hatch.build.targets.wheel]
sources = ["src"]
[tool.hatch.build.targets.sdist.force-include]
"uv.lock" = "uv.lock"
"poe_tasks.toml" = "poe_tasks.toml"
"scripts" = "scripts"
"dev.sh" = "dev.sh"
"docs" = "docs"
"src/tests/pytest_peewee/tester" = "src/tests/pytest_peewee/tester"

[tool.coverage.run]
source_pkgs = ["pytest_peewee"]
branch = true
parallel = true
patch = ["subprocess"]
omit = [
  "src/pytest_peewee/version.py",
  "**/site-packages/**",
  "/tmp/**",
  "src/tests/*",
]

[tool.coverage.paths]
pytest_peewee = ["src/pytest_peewee"]

[tool.coverage.report]
omit = [
  "*/__init__.py",
  "**/_pytest/*",
]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "__version__",
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--color=yes",
  "--no-header",
]
testpaths = ["src/tests"]
filterwarnings = ["once::Warning"]


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[tool.mypy]
files = ["src/pytest_peewee"]
exclude = ["src/pytest_peewee/version\\.py"]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# peewee's stubs do not cover playhouse
module = ["playhouse", "playhouse.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Overrides of untyped peewee methods call them via super()
module = ["pytest_peewee._isolation"]
disallow_untyped_calls = false

[tool.ty.src]
include = ["src/pytest_peewee"]
exclude = ["src/pytest_peewee/version.py"]

[tool.ty.rules]
all = "error"
# Empty strings mean unset (`parse_env` turns unset env vars into ""), so `if value:` is intended.
truthiness-test-of-none-union = "ignore"

[tool.pyright]
include = ["src/pytest_peewee"]
exclude = [
  "src/pytest_peewee/version.py",
  "**/tests/**",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnusedImport = false
deprecateTypingAliases = true
reportImplicitOverride = true
reportMissingSuperCall = true
reportPropertyTypeMismatch = true
reportUnnecessaryTypeIgnoreComment = true
# peewee has incomplete type info
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
