---
name: tests

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:  # yamllint disable-line rule:truthy

concurrency:
  group: |
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Python matrix
        id: set-matrix
        uses: ./.github/actions/py-version

  cache_docker:
    runs-on: ubuntu-latest

    outputs:
      cache_key: ${{ steps.cache-key.versions.outputs.cache_key }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Get cache key
        id: cache-key
        # yamllint disable rule:line-length
        run: |
          echo "cache_key=docker-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('./dev.sh') }}" >> $GITHUB_OUTPUT
        # yamllint enable rule:line-length

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@fb28c93772363301b8d0a6072ce850224b73f74e # 0.5.0
        with:
          key: ${{ steps.cache-key.outputs.cache_key }}

      - name: Fetch docker images
        run: ./dev.sh pull

  testing:
    needs:
      - generate-matrix
      - cache_docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Setup python version ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Download uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run dependency check
        run: uv run poe req

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@fb28c93772363301b8d0a6072ce850224b73f74e # 0.5.0
        with:
          key: "{{ needs.cache_docker.outputs.cache_key }}"

      - name: Run tests
        run: |
          set -e
          uv run poe setup
          uv run poe test:all-dbs --runxfail -vv
          uv run poe teardown

  lint:
    runs-on: ubuntu-latest
    needs: generate-matrix

    steps:
      - name: Setup python version ${{ needs.generate-matrix.outputs.newest }}  # yamllint disable-line rule:line-length
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.generate-matrix.outputs.newest }}  # yamllint disable-line rule:line-length

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run type checker
        run: uv run poe types:check

      - name: Check type completion
        run: uv run poe types:verify

      - name: Run linter
        run: uv run poe fmt:check

      - name: Spell Check Repo
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # https://github.com/marketplace/actions/alls-green#why
  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - testing
      - lint

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
