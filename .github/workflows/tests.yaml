---
name: tests

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:  # yamllint disable-line rule:truthy

concurrency:
  group: |
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set Python matrix
        id: set-matrix
        uses: .github/actions/py-version

  cache_docker:
    runs-on: ubuntu-latest

    outputs:
      cache_key: ${{ steps.cache-key.versions.outputs.cache_key }}

    steps:
      - uses: actions/checkout@v5

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Get cache key
        id: cache-key
        # yamllint disable rule:line-length
        run: |
          echo "cache_key=docker-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('./dev.sh') }}" >> $GITHUB_OUTPUT
        # yamllint enable rule:line-length

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: ${{ steps.cache-key.outputs.cache_key }}

      - name: Fetch docker images
        run: ./dev.sh pull

  testing:
    needs:
      - generate-matrix
      - cache_docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Setup python version ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Download uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/checkout@v5

      - name: Run dependency check
        run: uv run poe req

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: "{{ needs.cache_docker.outputs.cache_key }}"

      - name: Run tests
        run: |
          set -e
          uv run poe setup
          uv run poe test:all-dbs --runxfail -vv
          uv run poe teardown

  lint:
    runs-on: ubuntu-latest
    needs: generate-matrix

    steps:
      - name: Setup python version ${{ needs.generate-matrix.outputs.newest }}  # yamllint disable-line rule:line-length
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.generate-matrix.outputs.newest }}  # yamllint disable-line rule:line-length

      - uses: actions/checkout@v5

      - name: Run type checker
        run: uv run poe types:check

      - name: Check type completion
        run: uv run poe types:verify

      - name: Run linter
        run: uv run poe fmt:check

      - name: Spell Check Repo
        uses: crate-ci/typos@v1

  # https://github.com/marketplace/actions/alls-green#why
  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - testing
      - lint

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
