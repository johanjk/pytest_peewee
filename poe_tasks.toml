[env]
DBDRIVER = "psycopg3"
DBHOST = "127.0.0.1"
DBPORT = "30000"
DBDATABASE = "test_db"
DBUSER = "dbuser"
DBPASSWORD = "secret"

[tasks.setup]
cmd = "./dev.sh"
help = "Run the setup script"

[tasks.teardown]
cmd = "./dev.sh stop"
help = "Stop the development environment"

[tasks.test]
cmd = "pytest src/tests"
help = "Run test suite"

[tasks.ci]
sequence = ["setup", "test", "teardown"]
help = "Run test suite with setup/teardown"

[tasks.test-cov]
cmd = "coverage run -m pytest src/tests"
help = "Run tests with coverage tracking"

[tasks.cov-report]
sequence = [
  { cmd = "coverage combine" },
  { cmd = "coverage report" },
]
ignore_fail = true
help = "Combine and display coverage results"

[tasks.cov]
sequence = ["test-cov", "cov-report"]
help = "Run full coverage suite and print report"

[tasks.req]
cmd = "deptry src/pytest_peewee"
help = "Check dependency usage with deptry"

# ------------------------------------------------------------------------------
# LINTING TASKS
# ------------------------------------------------------------------------------
[tasks.lint]
cmd = "ruff check --ignore D"
[tasks.docstyle]
cmd = "ruff check --select D2"
[tasks.fmt]
sequence = [
  { cmd = "ruff check --select I --select F401 --fix" },
  { cmd = "ruff format" },
]
[tasks."fmt:check"]
sequence = [
  { cmd = "ruff check --select I --select F401 --output-format concise" },
  { cmd = "ruff format . --diff" },
]
ignore_fail = false

# ------------------------------------------------------------------------------
# TYPE CHECKING TASKS
# ------------------------------------------------------------------------------
[tasks."types:check"]
cmd = "pyright src/pytest_peewee src/tests"
help = "Run Pyright static type checker"

[tasks."types:check-mypy"]
cmd = "mypy --install-types --non-interactive src/pytest_peewee"
help = "Run MyPy type checker"

[tasks."types:verify"]
cmd = "pyright --verifytypes pytest_peewee --ignoreexternal"
help = "Verify exported type completions with Pyright"

[tasks."lint:ci"]
sequence = ["req", "lint", "docstyle", "types:check", "types:verify"]
help = "Run all lint related actions in CI"

# ------------------------------------------------------------------------------
# DISTRIBUTION TASKS
# ------------------------------------------------------------------------------
[tasks."dist:test-sdist"]
cmd = "./scripts/sdist.sh"
help = "Test source distribution build"

[tasks."dist:install"]
sequence = [
  { cmd = "./scripts/install.sh .sdist .tar.gz" },
  { cmd = "./scripts/install.sh .wheel .whl" },
]
help = "Test installation of sdist and wheel artifacts"

[tasks."dist:check"]
cmd = "./scripts/check.sh"
help = "Run checks against distribution packages"

[tasks."dist:all"]
sequence = ["dist:test-sdist", "dist:install", "dist:check"]

# ------------------------------------------------------------------------------
# MATRIX DB ENV TASKS
# ------------------------------------------------------------------------------
[tasks."test:postgres"]
cmd = "pytest src/tests"
help = "Run tests against PostgreSQL database"
[tasks."test:postgres".env]
DBDRIVER = "psycopg3"
DBHOST = "127.0.0.1"
DBPORT = "30000"
DBDATABASE = "test_db"
DBUSER = "dbuser"
DBPASSWORD = "secret"

[tasks."test:mysql"]
cmd = "pytest src/tests"
help = "Run tests against MySQL database"
[tasks."test:mysql".env]
DBDRIVER = "mysql"
DBHOST = "127.0.0.1"
DBPORT = "30001"
DBDATABASE = "test_db"
DBUSER = "dbuser"
DBPASSWORD = "secret"

[tasks."test:sqlite"]
cmd = "pytest src/tests"
help = "Run tests against SQLite database"
[tasks."test:sqlite".env]
DBDRIVER = ""
DBHOST = ""
DBPORT = ""
DBDATABASE = ""
DBUSER = ""
DBPASSWORD = ""

# ------------------------------------------------------------------------------
# COMPOSITE MATRIX RUNNER
# ------------------------------------------------------------------------------
[tasks."test:all-dbs"]
sequence = ["test:postgres", "test:mysql", "test:sqlite"]
help = "Run unit tests sequentially across PostgreSQL, MySQL, and SQLite"
