preview = true
output-format = "grouped"
output-prefer-rule-codes = true

line-length = 120

[format]
docstring-code-format = true

[lint.flake8-type-checking]
# Annotations of fixtures and hooks are read at runtime, e.g. by `inspect.signature`
runtime-evaluated-decorators = ["pytest.fixture", "pytest.hookimpl"]

[lint.pydocstyle]
convention = "google"

[lint]
select = ["ALL"]
ignore = [
  "RUF201", # Allow output-rule-codes
  "RUF106", # Allow output-rule-codes
  "CPY", # Copyright
  "ANN", # Annotations is typechecker concern
  "DOC201", # Docstring return convention
  "DOC402", # Docstring yield convention
  "DOC501", # Docstring raise convention
  "E731", # inline lambda
  "PT022", # yielding fixtures
  "FBT001", # boolean flags in args
  "FBT002", # boolean flags in args
  "A003", # shadow builtin (id table columns)
  "TC006", # Typecast as string
  "S101", # use of assert
  "PT003", # explicit 'function' scope fixtures
  "TID252", # Relative imports
  "D100", # module level docstring
  "D104", # package level docstring
]
[lint.per-file-ignores]
".github/**" = [
  "S404", # CI scripts call tools via subprocess
  "S607", # tools found on PATH
  "T201", # printing is the script output
]
"src/pytest_peewee/__init__.py" = [
  "F401", # unused imports
]
"src/tests/**/*.py" = [
  "S101", # asserts allowed in tests...
  "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
  "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
  "PLR2004", # Magic value used in comparison, ...
  "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
  "SLF001", # private member accessed
  "T201", # print statement
  "S608", # sql injection
  "PLC2701", # tests reach into the private modules
]
